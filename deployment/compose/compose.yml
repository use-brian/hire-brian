name: use-brian

x-service-defaults: &service-defaults
  restart: unless-stopped
  init: true

x-outpost-auth: &outpost-auth
  AUTH_PORTAL_URL: ${AUTH_PORTAL_URL:-}
  OUTPOST_AUTH_EMAIL_ENABLED: ${OUTPOST_AUTH_EMAIL_ENABLED:-true}
  OUTPOST_AUTH_OIDC_ENABLED: ${OUTPOST_AUTH_OIDC_ENABLED:-false}
  OUTPOST_OIDC_ISSUER_URL: ${OUTPOST_OIDC_ISSUER_URL:-}
  OUTPOST_OIDC_CLIENT_ID: ${OUTPOST_OIDC_CLIENT_ID:-}
  OUTPOST_OIDC_CLIENT_SECRET: ${OUTPOST_OIDC_CLIENT_SECRET:-}
  OUTPOST_OIDC_PROVIDER_NAME: ${OUTPOST_OIDC_PROVIDER_NAME:-}
  OUTPOST_OIDC_ALLOWED_ENDPOINT_ORIGINS: ${OUTPOST_OIDC_ALLOWED_ENDPOINT_ORIGINS:-}
  OUTPOST_OIDC_EMAIL_VERIFICATION: ${OUTPOST_OIDC_EMAIL_VERIFICATION:-claim}
  OUTPOST_OIDC_SUBJECT_IDENTITY_ENABLED: ${OUTPOST_OIDC_SUBJECT_IDENTITY_ENABLED:-false}
  OUTPOST_OIDC_ENROLLMENT_MODE: ${OUTPOST_OIDC_ENROLLMENT_MODE:-invite_only}
  OUTPOST_OIDC_WORKSPACE_MAPPINGS: ${OUTPOST_OIDC_WORKSPACE_MAPPINGS:-}
  OUTPOST_AUTH_BRIDGE_SECRET: ${OUTPOST_AUTH_BRIDGE_SECRET:-}

services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: brian
      POSTGRES_USER: brian
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./init-db.sh:/docker-entrypoint-initdb.d/10-use-brian.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brian -d brian"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *service-defaults
    image: ghcr.io/use-brian/api:${BRIAN_IMAGE_TAG:-latest}
    command: ["packages/api/node_modules/.bin/tsx", "packages/api/scripts/migrate.ts"]
    environment:
      DATABASE_URL: postgresql://brian:${POSTGRES_PASSWORD}@postgres:5432/brian
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  grant-app-role:
    image: pgvector/pgvector:pg18
    command: ["psql", "--set=ON_ERROR_STOP=1", "--file=/scripts/grant-app-role.sql"]
    environment:
      PGHOST: postgres
      PGDATABASE: brian
      PGUSER: brian
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./grant-app-role.sql:/scripts/grant-app-role.sql:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    <<: *service-defaults
    image: ghcr.io/use-brian/api:${BRIAN_IMAGE_TAG:-latest}
    env_file: ${BRIAN_ENV_FILE:-.env}
    environment:
      <<: *outpost-auth
      NODE_ENV: production
      PORT: "4000"
      HOME: /data
      USEBRIAN_EDITION: ${USEBRIAN_EDITION:-oss}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      OUTPOST_AUTH_BOOTSTRAP_EMAILS: ${OUTPOST_AUTH_BOOTSTRAP_EMAILS:-}
      DATABASE_URL: postgresql://brian:${POSTGRES_PASSWORD}@postgres:5432/brian
      DATABASE_URL_APP: postgresql://app_user:${APP_DATABASE_PASSWORD}@postgres:5432/brian
      APP_URL: ${PUBLIC_APP_URL:-http://localhost:3003}
      AUTHED_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3003}
      API_URL: ${PUBLIC_API_URL:-http://localhost:4000}
      WEBHOOK_BASE_URL: ${PUBLIC_API_URL:-http://localhost:4000}
      DOC_SYNC_URL: http://doc-sync:8080
      BROWSER_RELAY_URL: ${PUBLIC_RELAY_URL:-http://localhost:8094}
      DISCORD_CONNECTOR_URL: http://discord-connector:8080
      WA_CONNECTOR_URL: http://wa-connector:8080
      WECHAT_CONNECTOR_URL: http://wechat-connector:8080
      FEISHU_CONNECTOR_URL: http://feishu-connector:8080
      LOCAL_FILES_DIR: /data/files
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - brian-data:/data
    depends_on:
      grant-app-role:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30

  app-web:
    <<: *service-defaults
    image: ghcr.io/use-brian/app-web:${BRIAN_IMAGE_TAG:-latest}
    environment:
      NODE_ENV: production
      PORT: "3003"
      INTERNAL_API_URL: http://api:4000
      API_URL: http://api:4000
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3003}
      PUBLIC_PRIMARY_AUTH_URL: ${PUBLIC_PRIMARY_AUTH_URL:-}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:4000}
      PUBLIC_DISPLAY_API_URL: ${PUBLIC_API_URL:-http://localhost:4000}
      PUBLIC_DOC_SYNC_URL: ${PUBLIC_DOC_SYNC_URL:-ws://localhost:8080}
      APP_URL: ${PUBLIC_APP_URL:-http://localhost:3003}
      AUTHED_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3003}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      USEBRIAN_EDITION: ${USEBRIAN_EDITION:-oss}
      APP_HOSTS: ${APP_HOSTS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      PUBLIC_GOOGLE_API_KEY: ${PUBLIC_GOOGLE_API_KEY:-}
      GOOGLE_PROJECT_NUMBER: ${GOOGLE_PROJECT_NUMBER:-}
      NOTION_CLIENT_ID: ${NOTION_CLIENT_ID:-}
      NOTION_CLIENT_SECRET: ${NOTION_CLIENT_SECRET:-}
      FATHOM_CLIENT_ID: ${FATHOM_CLIENT_ID:-}
      FATHOM_CLIENT_SECRET: ${FATHOM_CLIENT_SECRET:-}
      SHOPIFY_CLIENT_ID: ${SHOPIFY_CLIENT_ID:-}
      SHOPIFY_CLIENT_SECRET: ${SHOPIFY_CLIENT_SECRET:-}
    ports:
      - "127.0.0.1:3003:3003"
    depends_on:
      api:
        condition: service_healthy

  auth-web:
    <<: *service-defaults
    profiles: ["outpost"]
    image: ghcr.io/use-brian/auth-web:${BRIAN_IMAGE_TAG:-latest}
    environment:
      <<: *outpost-auth
      NODE_ENV: production
      PORT: "3005"
      INTERNAL_API_URL: http://api:4000
      AUTHED_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3003}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      TRUST_PROXY_HEADERS: "false"
    ports:
      - "127.0.0.1:3005:3005"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3005/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 20

  doc-sync:
    <<: *service-defaults
    image: ghcr.io/use-brian/doc-sync:${BRIAN_IMAGE_TAG:-latest}
    environment:
      NODE_ENV: production
      PORT: "8080"
      DATABASE_URL: postgresql://brian:${POSTGRES_PASSWORD}@postgres:5432/brian
      DATABASE_URL_APP: postgresql://app_user:${APP_DATABASE_PASSWORD}@postgres:5432/brian
      JWT_SECRET: ${JWT_SECRET}
      DOC_SYNC_SECRET: ${DOC_SYNC_SECRET}
      API_INTERNAL_URL: http://api:4000
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20

  browser-relay:
    <<: *service-defaults
    image: ghcr.io/use-brian/browser-relay:${BRIAN_IMAGE_TAG:-latest}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "8080"
      JWT_SECRET: ${JWT_SECRET}
      BROWSER_RELAY_SECRET: ${BROWSER_RELAY_SECRET}
    ports:
      - "127.0.0.1:8094:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20

  discord-connector:
    <<: *service-defaults
    image: ghcr.io/use-brian/discord-connector:${BRIAN_IMAGE_TAG:-latest}
    environment:
      NODE_ENV: production
      PORT: "8080"
      USEBRIAN_API_URL: http://api:4000
      DISCORD_CONNECTOR_SECRET: ${DISCORD_CONNECTOR_SECRET}
    depends_on:
      api:
        condition: service_healthy

  wa-connector:
    <<: *service-defaults
    image: ghcr.io/use-brian/wa-connector:${BRIAN_IMAGE_TAG:-latest}
    environment:
      NODE_ENV: production
      PORT: "8080"
      USEBRIAN_API_URL: http://api:4000
      DATABASE_URL: postgresql://brian:${POSTGRES_PASSWORD}@postgres:5432/brian
      WA_CONNECTOR_SECRET: ${WA_CONNECTOR_SECRET}
      WA_LOCAL_CREDS_DIR: /data
    volumes:
      - whatsapp-data:/data
    depends_on:
      api:
        condition: service_healthy

  wechat-connector:
    <<: *service-defaults
    image: ghcr.io/use-brian/wechat-connector:${BRIAN_IMAGE_TAG:-latest}
    environment:
      NODE_ENV: production
      PORT: "8080"
      USEBRIAN_API_URL: http://api:4000
      WECHAT_CONNECTOR_SECRET: ${WECHAT_CONNECTOR_SECRET}
    depends_on:
      api:
        condition: service_healthy

  feishu-connector:
    <<: *service-defaults
    image: ghcr.io/use-brian/feishu-connector:${BRIAN_IMAGE_TAG:-latest}
    environment:
      NODE_ENV: production
      PORT: "8080"
      USEBRIAN_API_URL: http://api:4000
      FEISHU_CONNECTOR_SECRET: ${FEISHU_CONNECTOR_SECRET}
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  brian-data:
  whatsapp-data:
